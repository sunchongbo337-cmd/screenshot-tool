<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>ScreenShot</title>
    <style>
      html,
      body {
        margin: 0;
        min-height: 100%;
        background: #12141c;
        color: #e7eaf0;
        font-family: system-ui, sans-serif;
      }
      main {
        display: grid;
        place-items: center;
        min-height: 100vh;
        padding: 24px;
        text-align: center;
        gap: 16px;
      }
      button {
        padding: 12px 20px;
        border-radius: 10px;
        border: 1px solid rgba(38, 220, 98, 0.5);
        background: rgba(38, 220, 98, 0.15);
        color: #e7eaf0;
        font-size: 15px;
        cursor: pointer;
      }
      button:hover {
        background: rgba(38, 220, 98, 0.28);
      }
      p {
        margin: 0;
        opacity: 0.85;
        max-width: 380px;
        line-height: 1.5;
      }
    </style>
  </head>
  <body>
    <main>
      <p id="sshot-hint">请点下方按钮，在共享窗口中选择要截取的内容。</p>
      <button type="button" id="sshot-start-btn">选择共享并开始截图</button>
    </main>
    <script src="content.js"></script>
  </body>
</html>
